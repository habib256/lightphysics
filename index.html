<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <script language="javascript" src="p5js/p5.min.js"></script>

    <title>2D Ray Casting Physic</title>
    <link rel="icon" href="data:," />
    <style>
      /* Fond noir sur toute la page, simulation centrée.
         Sur un écran plus petit que 800×600 (tablette en portrait, iframe réduit),
         lightphysics/ecran.js réduit la taille affichée du canvas. */
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { touch-action: manipulation; }
      main { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      /* Au doigt : le geste sur la simulation attrape les objets,
         il ne fait ni défiler, ni zoomer, ni sélectionner, ni ouvrir de menu. */
      canvas {
        display: block;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <script src="lightphysics/config.js"></script>
    <script src="lightphysics/ray.js"></script>
    <script src="lightphysics/dioptre.js"></script>
    <script src="lightphysics/light.js"></script>
    <script src="lightphysics/spatial-grid.js"></script>
    <script src="lightphysics/matter.min.js"></script>
    <script src="lightphysics/utils.js"></script>
    <script src="lightphysics/physics-object.js"></script>
    <script src="lightphysics/box.js"></script>
    <script src="lightphysics/ball.js"></script>
    <script src="lightphysics/ecran.js"></script>
    <script src="lightphysics/pesanteur.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
